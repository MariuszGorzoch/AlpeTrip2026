// ── DISTANCE ARROW helper ──────────────────────────────────────────────────
function addDistanceArrow(map, from, to, label, color) {
  color = color || '#f97316';
  L.polyline([from, to], {
    color: color, weight: 2.5, opacity: 0.75, dashArray: '7 5'
  }).addTo(map);

  // arrowhead at destination
  const p1 = map.latLngToContainerPoint(from);
  const p2 = map.latLngToContainerPoint(to);
  const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;

  const arrowDiv = L.divIcon({
    className: '',
    html: `<div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:13px solid ${color};transform:rotate(${angle + 90}deg);opacity:0.85;"></div>`,
    iconSize: [14, 13], iconAnchor: [7, 6]
  });
  L.marker(to, { icon: arrowDiv, interactive: false }).addTo(map);

  // distance badge at midpoint
  const mid = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
  const badgeIcon = L.divIcon({
    className: '',
    html: `<div class="dist-badge">${label}</div>`,
    iconAnchor: [20, 10]
  });
  L.marker(mid, { icon: badgeIcon, interactive: false }).addTo(map);
}

    desc: 'Legendarny stary szlak wydrążony w skale nad jeziorem Garda. Must-ride na rowerze gravel &mdash; spektakularne widoki.',
    gmaps: 'https://maps.google.com/?q=Strada+del+Ponale,+Riva+del+Garda'
  },
  {
    name: 'Arco Climbing',
    emoji: '\u{1F9D7}',
    coord: [45.9180, 10.8760],
    dist: '~1 km',
    color: '#ea580c',
    desc: 'Światowa stolica wspinaczki skalnej. Ponad 1500 dr\u00f3g w najbli\u017cszej okolicy. Co roku Rock Master World Cup.',
    gmaps: 'https://maps.google.com/?q=Arco+climbing+sector'
  },
  {
    name: 'Lago di Ledro',
    emoji: '\u{26F0}',
    coord: [45.8742, 10.7569],
    dist: '~20 km',
    color: '#0891b2',
    desc: 'Spokojne górskie jezioro na wys. 655 m. Muzeum palafitów UNESCO. Dobry cel na gravel p\u0119tlę przez Ponale.',
    gmaps: 'https://maps.google.com/?q=Lago+di+Ledro'
  },
];

ATTRACTIONS.forEach(a => {
  // Draw arrow from hotel
  addDistanceArrow(map, HOTEL, a.coord, a.dist, a.color);

  // Marker dot with emoji
  const icon = L.divIcon({
    className: '',
    html: `<div class="attr-dot" style="background:${a.color};">${a.emoji}</div>`,
    iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
  });

  const popup =
    `<div class="popup-title">${a.name}</div>` +
    `<div class="popup-meta">${a.desc}</div>` +
    `<div class="popup-links"><a href="${a.gmaps}" target="_blank" rel="noopener">Google Maps</a></div>`;

  L.marker(a.coord, { icon }).bindPopup(popup).addTo(map);
});

// ── LEGEND ─────────────────────────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <details>
      <summary>Legenda</summary>
      <div class="legend-body">
        <div class="row"><svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><path d="M3 9.5L12 3l9 6.5V21H15v-5h-6v5H3V9.5z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/></svg> Hotel Garden Arco</div>
        <div class="row"><span class="dot" style="background:#dc2626"></span> &#127984; Castello di Arco (~2 km)</div>
        <div class="row"><span class="dot" style="background:#ea580c"></span> &#129495; Arco Climbing (~1 km)</div>
        <div class="row"><span class="dot" style="background:#0ea5e9"></span> &#127754; Riva del Garda (~6 km)</div>
        <div class="row"><span class="dot" style="background:#7c3aed"></span> &#128692; Strada del Ponale (~9 km)</div>
        <div class="row"><span class="dot" style="background:#059669"></span> &#128167; Lago di Tenno (~10 km)</div>
        <div class="row"><span class="dot" style="background:#0891b2"></span> &#9968; Lago di Ledro (~20 km)</div>
        <div style="font-size:11px;color:#888;margin-top:6px;">Strzałki = dystans rowerem od hotelu</div>
      </div>
    </details>
  `;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
