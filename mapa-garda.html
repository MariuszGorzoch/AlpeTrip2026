// Draw routes
ROUTES.forEach(r => {
  const line = L.polyline(r.coords, {
    color: r.color, weight: 4, opacity: 0.82,
    dashArray: '10 6'
  }).addTo(map);

  // Popup with stats
  const popupHtml =
    '<div class="popup-title" style="color:' + r.color + '">' + r.name + '</div>' +
    '<div class="popup-stats">' +
      '<div class="popup-stat"><strong>' + r.dist_km + ' km</strong><span>dystans</span></div>' +
      '<div class="popup-stat"><strong>&#8679;' + r.elev_up + 'm</strong><span>w g&oacute;r&#281;</span></div>' +
      '<div class="popup-stat"><strong>&#8681;' + r.elev_down + 'm</strong><span>w d&oacute;&#322;</span></div>' +
      '<div class="popup-stat"><strong>' + r.difficulty + '</strong><span>poziom</span></div>' +
    '</div>' +
    '<div class="popup-meta">' + r.desc + '</div>' +
    '<div class="popup-links"><a href="' + r.source_url + '" target="_blank">📍 Źródło trasy</a></div>';
  line.bindPopup(popupHtml);

  // Per-route label positions — spread so they don't overlap each other
  const LABEL_PCT = {ponale: 0.22, tremalzo: 0.46, tenno: 0.52, stivo: 0.38, giro_lago: 0.25};
  const pct = LABEL_PCT[r.id] || 0.30;
  const idx = Math.floor(r.coords.length * pct);
  const labelCoord = r.coords[idx];
  const labelHtml =
    '<div class="route-label" style="border-left:4px solid ' + r.color + '">' +
      '<div class="rl-name">' + r.name + '</div>' +
      '<div class="rl-stats">' + r.dist_km + ' km &middot; &uarr;' + r.elev_up + 'm &middot; ' + r.difficulty + '</div>' +
    '</div>';
  L.marker(labelCoord, {
    icon: L.divIcon({ className: '', html: labelHtml, iconAnchor: [0, 0] })
  }).bindPopup(popupHtml).addTo(map);
});
