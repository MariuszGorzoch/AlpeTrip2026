<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Mapa Lago di Garda / Arco | Alpe Adria 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/leaflet.css" />
<style>
  :root { color-scheme: light; }
  html, body { margin:0; padding:0; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map { position:fixed; top:0; left:0; width:100%; height:100%; }
  .back-btn {
    position:absolute; top:12px; left:12px; z-index:1000;
    background:rgba(255,255,255,0.95); border:1px solid #ddd;
    padding:7px 12px; border-radius:8px; font-size:13px; font-weight:500;
    box-shadow:0 1px 4px rgba(0,0,0,0.15); text-decoration:none; color:#1a1a1a;
    backdrop-filter:blur(4px);
  }
  .back-btn:hover { background:#f0eee5; }
  .legend { background:rgba(255,255,255,0.96); border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.15); font-size:12px; line-height:1.5; max-width:260px; overflow:hidden; }
  .legend details summary { padding:8px 12px; cursor:pointer; font-weight:600; font-size:13px; user-select:none; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .legend details summary::-webkit-details-marker { display:none; }
  .legend details summary::after { content:"▾"; font-size:11px; color:#666; }
  .legend details[open] summary::after { transform:rotate(180deg); }
  .legend details summary:hover { background:#f5f5f5; }
  .legend .legend-body { padding:0 12px 10px; border-top:1px solid #eee; }
  .legend .row { display:flex; align-items:center; gap:6px; margin:5px 0; }
  .legend .swatch { width:18px; height:4px; border-radius:2px; display:inline-block; }
  .legend .dot { width:10px; height:10px; border-radius:50%; border:2px solid white; box-shadow:0 0 0 1px rgba(0,0,0,0.3); display:inline-block; }
  .note { font-size:11px; color:#666; margin-top:6px; }
  .popup-title { font-weight:600; font-size:13px; margin-bottom:2px; }
  .popup-meta { color:#555; font-size:12px; }
  .popup-links { margin-top:6px; font-size:12px; }
  .popup-links a { display:inline-block; margin-right:8px; color:#1f6feb; }
  .popup-img { width:220px; max-width:100%; height:auto; border-radius:6px; margin-bottom:6px; display:block; }

  /* House hotel marker */
  .hotel-marker { position:relative; pointer-events:none; }
  .hotel-marker .pin-tail { position:absolute; left:50%; transform:translateX(-50%); width:0; height:0; }
  .hotel-marker .dot-wrap { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:18px; height:18px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); pointer-events:auto; }
</style>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <a class="back-btn" href="mapy.html">← Mapy</a>
  <div id="map"></div>

<script src="assets/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([45.89, 10.83], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Hotel Garden Arco — noclegi
const GARDEN = {
  name: 'Hotel Garden Arco',
  coord: [45.9241, 10.8902],
  note: 'Via Paolina Caproni Maini 40, 38062 Arco (TN). Baza wypadowa na wszystkie pętle gravel.',
  gmaps: 'https://maps.google.com/?q=Hotel+Garden+Arco,+Via+Paolina+Caproni+Maini+40,+38062+Arco',
  booking: 'https://www.booking.com/hotel/it/garden-arco.pl.html'
};

const gardenIconHtml = `
  <div class="hotel-marker" style="width:120px;height:60px;">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:64px;height:42px;background:#eff6ff;border-radius:8px;
      border:2px solid #3b82f6;box-shadow:0 2px 6px rgba(0,0,0,.3);
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px">
      <svg viewBox="0 0 24 24" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9.5L12 3l9 6.5V21H15v-5h-6v5H3V9.5z"
          fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.2" stroke-linejoin="round"/>
        <rect x="9" y="13" width="6" height="8" fill="#fff" rx="1"/>
      </svg>
      <span style="font-size:9px;font-weight:700;color:#1d4ed8;line-height:1">noclegi</span>
    </div>
    <div class="pin-tail" style="top:43px;border-top:8px solid #3b82f6;opacity:0.9;"></div>
    <div class="dot-wrap" style="background:#3b82f6;"></div>
  </div>`;

const gardenIcon = L.divIcon({
  className: 'hotel-divicon',
  html: gardenIconHtml,
  iconSize: [120, 60], iconAnchor: [60, 58], popupAnchor: [0, -56]
});

const gardenPopup =
  '<div class="popup-title">' + GARDEN.name + '</div>' +
  '<div class="popup-meta">' + GARDEN.note + '</div>' +
  '<div class="popup-links">' +
  '<a href="' + GARDEN.gmaps + '" target="_blank" rel="noopener">Google Maps</a> · ' +
  '<a href="' + GARDEN.booking + '" target="_blank" rel="noopener">Booking.com</a>' +
  '</div>';

L.marker(GARDEN.coord, { icon: gardenIcon }).bindPopup(gardenPopup).addTo(map);

// Reference points (towns, lakes)
const refPoints = [
  { name: 'Riva del Garda', coord: [45.8854, 10.8410] },
  { name: 'Lago di Tenno', coord: [45.9140, 10.8222] },
  { name: 'Lago di Ledro', coord: [45.8742, 10.7569] },
  { name: 'Limone sul Garda', coord: [45.8095, 10.7853] },
  { name: 'Pregasina', coord: [45.8504, 10.7906] },
  { name: 'Tremalzo (approx)', coord: [45.8500, 10.6500] },
];
refPoints.forEach(p => {
  L.circleMarker(p.coord, { radius: 4, color: '#444', weight: 1, fillColor: '#fff', fillOpacity: 1 })
    .bindTooltip(p.name)
    .addTo(map);
});

// Approximate gravel ride lines (not GPX-accurate — for visualisation)
const ponale = [
  [45.8854, 10.8410], [45.8743, 10.8273], [45.8584, 10.8120],
  [45.8504, 10.7906], [45.8742, 10.7569]
];
const ponaleLine = L.polyline(ponale, { color: '#16a34a', weight: 4, opacity: 0.85 })
  .bindPopup('<div class="popup-title">Strada del Ponale + Lago di Ledro</div><div class="popup-meta">~50–70 km, 800–1200 m. Day-1 warm-up.</div>')
  .addTo(map);

const tennoLoop = [
  [45.9180, 10.8855], [45.9000, 10.8500], [45.9050, 10.8200],
  [45.9140, 10.8222], [45.9210, 10.8400], [45.9180, 10.8855]
];
const tennoLine = L.polyline(tennoLoop, { color: '#16a34a', weight: 4, opacity: 0.85, dashArray: '6 6' })
  .bindPopup('
