"google_images":"https://www.google.com/search?q=Venzone&tbm=isch"},{"key":"fusine","name":"Laghi di Fusine (★)","short":"Laghi di Fusine","desc":"Bliźniacze turkusowe jeziora alpejskie pod masywem Mangart. Kąpiel jeśli wytrzymasz zimno.","dist_bike":"35 km","coord":[46.4788,13.67],"thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Lake_of_Fusine_2.jpg/330px-Lake_of_Fusine_2.jpg","wiki":"https://it.wikipedia.org/wiki/Laghi_di_Fusine","commons":"https://commons.wikimedia.org/wiki/Category:Laghi_di_Fusine","google_images":"https://www.google.com/search?q=Laghi+di+Fusine&tbm=isch"},{"key":"gemona","name":"Gemona del Friuli","short":"Gemona","desc":"Także odbudowane po 1976. Imponująca katedra z romańską fasadą św. Krzysztofa.","dist_bike":"38 km","coord":[46.28333333,13.13333333],"thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Gemona_Duomo_di_Santa_Maria_Assunta_14082004_01.jpg/330px-Gemona_Duomo_di_Santa_Maria_Assunta_14082004_01.jpg","wiki":"https://en.wikipedia.org/wiki/Gemona_del_Friuli","commons":"https://commons.wikimedia.org/wiki/Category:Gemona_del_Friuli","google_images":"https://www.google.com/search?q=Gemona+del+Friuli&tbm=isch"},{"key":"tolmezzo","name":"Tolmezzo","short":"Tolmezzo","desc":"Stolica Carnii — barokowa katedra, Muzeum Sztuki Ludowej.","dist_bike":"50 km","coord":[46.401,13.018],"thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/TolmezzoPanoramaConCaneva.jpg/330px-TolmezzoPanoramaConCaneva.jpg","wiki":"https://en.wikipedia.org/wiki/Tolmezzo","commons":"https://commons.wikimedia.org/wiki/Category:Tolmezzo","google_images":"https://www.google.com/search?q=Tolmezzo&tbm=isch"},{"key":"osoppo","name":"Forte di Osoppo","short":"Osoppo","desc":"Twierdza na wzgórzu z widokami na nizinę Friuli. Stary punkt graniczny Habsburgów.","dist_bike":"45 km","coord":[46.25,13.08333333],"thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Osoppo.JPG/330px-Osoppo.JPG","wiki":"https://en.wikipedia.org/wiki/Osoppo","commons":"https://commons.wikimedia.org/wiki/Category:Osoppo","google_images":"https://www.google.com/search?q=Osoppo&tbm=isch"}];

const map = L.map('map', { zoomControl: true }).setView([46.50, 13.40], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const fullGroup = L.featureGroup();
POLYLINES.full.forEach(seg => {
  L.polyline(seg, { color: '#3b82f6', weight: 3, opacity: 0.85 }).addTo(fullGroup);
});
fullGroup.addTo(map);
fullGroup.bindPopup('<div class="popup-title">Ciclovia Alpe Adria (cała trasa)</div><div class="popup-meta">Salzburg → Grado, ~423 km. OSM relation 19738530.</div>');

const highlightGroup = L.featureGroup();
POLYLINES.highlight.forEach(seg => {
  L.polyline(seg, { color: '#dc2626', weight: 5, opacity: 0.95 }).addTo(highlightGroup);
});
highlightGroup.addTo(map);
highlightGroup.bindPopup('<div class="popup-title">Najlepszy odcinek: Tarvisio → Venzone (CAAR6)</div><div class="popup-meta">~85 km, dawna kolej Pontebbana w dolinie Fella — galerie, wiadukty, wąwozy.</div>');

// Villa Libuse hotel marker (only hotel)
const hotelIconHtml = `
  <div class="hotel-marker" style="width:140px;height:74px;">
    <div class="thumb-wrap"><img src="${LIBUSE.thumb_url}" alt=""></div>
    <div class="pin-tail" style="top:51px;border-top:8px solid #84cc16;opacity:0.9;"></div>
    <div class="dot-wrap" style="background:#84cc16;"></div>
  </div>`;
const hotelIcon = L.divIcon({
  className: 'hotel-divicon',
  html: hotelIconHtml,
  iconSize: [140, 74], iconAnchor: [70, 72], popupAnchor: [0, -70]
});
const libuseLink = `<a href="${LIBUSE.website}" target="_blank" rel="noopener">${LIBUSE.website.replace(/^https?:\/\//,'').replace(/\/$/,'')}</a>`;
const libusePopup = `<img class="popup-img" src="${LIBUSE.thumb_url}" alt=""><div class="popup-title">${LIBUSE.name}</div><div class="popup-meta">${LIBUSE.note}<br>${libuseLink}</div>`;
const libuseMarker = L.marker(LIBUSE.coord, { icon: hotelIcon }).bindPopup(libusePopup).addTo(map);
// B&B Stari Mlin - Vecchio Mulino (San Giorgio di Resia)
const STARI_MLIN = {
  name: 'B&B Stari Mlin – Vecchio Mulino',
  coord: [46.3734, 13.2874],
  note: '6 SP42, 33010 San Giorgio di Resia (Val Resia, UD). Stary młyn w dolinie Resia — cicha lokalizacja, ~35 km rowerem od Pontebby.',
  gmaps: 'https://maps.google.com/?q=B%26B+Stari+Mlin+Vecchio+Mulino,+SP42+6,+33010+San+Giorgio,+Italy',
  booking: 'https://www.booking.com/hotel/it/b-amp-b-stari-mlin-vecchio-mulino.pl.html'
};
const stariMlinMarker = L.circleMarker(STARI_MLIN.coord, {
  radius: 9, color: '#fff', weight: 2.5, fillColor: '#22c55e', fillOpacity: 1
}).bindPopup(
  '<div class="popup-title">' + STARI_MLIN.name + '</div>' +
  '<div class="popup-meta">' + STARI_MLIN.note + '</div>' +
  '<div class="popup-links" style="margin-top:6px">' +
  '<a href="' + STARI_MLIN.gmaps + '" target="_blank" rel="noopener">Google Maps / zdjęcia</a> · ' +
  '<a href="' + STARI_MLIN.booking + '" target="_blank" rel="noopener">Booking.com</a>' +
  '</div>'
).addTo(map);

// Star SVG (yellow)
const STAR_SVG = `<svg class="star-pin" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2 L14.6 8.6 L21.8 9.2 L16.3 14 L18 21 L12 17.3 L6 21 L7.7 14 L2.2 9.2 L9.4 8.6 Z"
    fill="#f5b301" stroke="#7a5800" stroke-width="1.2" stroke-linejoin="round"/>
</svg>`;

const placeMarkers = [];
PLACES.forEach(pl => {
  if (!pl.coord) return;
  const thumbBlock = pl.thumb ? `<div class="thumb"><img src="${pl.thumb}" alt="" loading="lazy"></div>` : '';
  const iconHtml = `
    <div class="star-marker">
      ${thumbBlock}
      ${STAR_SVG}
      <div class="label">${pl.short}</div>
    </div>`;
  const hasThumb = !!pl.thumb;
  const icon = L.divIcon({
    className: 'star-divicon',
    html: iconHtml,
    iconSize: hasThumb ? [140, 110] : [140, 50],
    iconAnchor: hasThumb ? [70, 90] : [70, 30],   // anchor at base of star
    popupAnchor: hasThumb ? [0, -88] : [0, -28]
  });

  const popImg = pl.thumb ? `<img class="popup-img" src="${pl.thumb}" alt="" loading="lazy">` : '';
  const links = [];
  if (pl.wiki)          links.push(`<a href="${pl.wiki}" target="_blank" rel="noopener">Wikipedia</a>`);
  if (pl.commons)       links.push(`<a href="${pl.commons}" target="_blank" rel="noopener">Galeria zdjęć (Commons)</a>`);
  if (pl.google_images) links.push(`<a href="${pl.google_images}" target="_blank" rel="noopener">Google Images</a>`);
  const popHtml = `${popImg}<div class="popup-title">${pl.name}</div><div class="popup-meta">${pl.desc}<br><b>Rower z Villa Libuse:</b> ~${pl.dist_bike}</div><div class="popup-links">${links.join(' · ')}</div>`;

  const m = L.marker(pl.coord, { icon }).bindPopup(popHtml).addTo(map);
  placeMarkers.push(m);
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <details>
      <summary>Legenda</summary>
      <div class="legend-body">
        <div class="row"><span class="swatch" style="background:#3b82f6"></span> Trasa Alpe Adria (cała)</div>
        <div class="row"><span class="swatch" style="background:#dc2626"></span> Najlepszy odcinek: Tarvisio → Venzone</div>
        <div class="row"><span class="dot" style="background:#84cc16"></span> Villa Libuse B&B (baza)</div>
        <div class="row"><span class="star">★</span> Atrakcja warta zobaczenia (kliknij)</div>
        <div class="note">Kliknij gwiazdkę, aby zobaczyć zdjęcie, opis i linki do Wikipedii / galerii zdjęć.</div>
      </div>
    </details>
  `;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
legend.addTo(map);

const placesGroup = L.featureGroup(placeMarkers);

function fitHighlight() { map.flyToBounds(highlightGroup.getBounds().pad(0.1), { duration: 1.2 }); }
function fitFull()      { map.flyToBounds(fullGroup.getBounds().pad(0.05), { duration: 1.4 }); }
function fitHotel()     { map.flyTo(LIBUSE.coord, 13, { duration: 1.2 }); }
function fitPlaces()    { map.flyToBounds(placesGroup.getBounds().pad(0.15), { duration: 1.4 }); }
fitPlaces();
</script>
</body>
</html>
